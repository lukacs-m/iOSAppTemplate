  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_xctest_method
  - enum_case_associated_values_count
  - expiring_todo
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
#  - function_default_parameter_at_end
  - ibinspectable_in_extension
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - let_var_whitespace
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - nimble_operator
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle
  - number_separator
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition
  - unhandled_throwing_task

###############
##opt_in_rules#
###############


################
#customed rules#
################

identifier_name:
  min_length: 2
  excluded:
    - id

number_separator:
  minimum_length: 5

# Customize:
trailing_whitespace:
  ignores_empty_lines: true

line_length:
  warning: 150
  error: 200
  ignores_urls: true
  ignores_comments: true

type_body_length:
  - 600 # warning
  - 800 # error

large_tuple:
 warning: 2 # only warning
 error: 4 # only error

file_length:
  warning: 1000
  error: 1200

function_body_length: # Functions bodies should not span too many lines.
 warning: 100
 error: 200

type_name:
  min_length: 3
  max_length:
    warning: 60
    error: 70
  allowed_symbols: "_"

implicit_return:
  included: [closure] # possible values: [closure, getter, function]
private_outlet:
  allow_private_set: true

custom_rules:
    nonisolated_async_warning:
        name: "Nonisolated Async Function"
        regex: '\bnonisolated\b\s*\n?\s*func\s+\w+\s*\([^)]*\)\s*async\b'
        message: "Consider migrating this `nonisolated func ... async` to the new Swift 6.2 `@concurrent` isolation model."
        severity: warning

    deprecated_foregroundcolor_modifier:
        name: "Deprecated foregroundColor modifier"
        message: "Prefer foregroundStyle over deprecated foregroundColor"
        regex: "(foregroundColor\\()"

    discouraged_anyview:
        name: "Discouraged AnyView"
        message: "Avoid using AnyView for better performance"
        regex: "(AnyView)"
