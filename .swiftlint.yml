# You can find the documentation here :
# https://realm.github.io/SwiftLint/rule-directory.html

################
#Included Folder#
################

included:
  - iOSAppTemplate
  - LocalLibraries/CommonLayer
  - LocalLibraries/DataLayer
  - LocalLibraries/DomainLayer
  - LocalLibraries/PresentationLayer

################
#Excluded Folder & Files#
################

excluded:
  # App tests
 - "**/*Tests"
 - "**/*Tests/**"
 - fastlane/**
 - Package.swift
 - LocalLibraries/**/Package.swift
 - scripts

##############
#Specific analyzer rules#
##############

analyzer_rules: # Rules run by `swiftlint analyze`
  - explicit_self
  - unused_declaration
  - unused_import

##############
#Disabled rules#
##############

disabled_rules:
  # - private_over_fileprivate
  # - cyclomatic_complexity
  # - function_body_length
  # - redundant_string_enum_value
  - nesting

##############
#Opted in rules#
##############

